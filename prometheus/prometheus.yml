# Reference for the default base port. stack.py generates active config for --dir.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: cometbft
    static_configs:
      - targets: ['127.0.0.1:28603']
        labels: {node: node0, role: validator}
      - targets: ['127.0.0.1:28613']
        labels: {node: node1, role: validator}
      - targets: ['127.0.0.1:28623']
        labels: {node: node2, role: validator}
      - targets: ['127.0.0.1:28633']
        labels: {node: node3, role: validator}
      - targets: ['127.0.0.1:28643']
        labels: {node: node4, role: full}
  - job_name: cpc-application
    static_configs:
      - targets: ['127.0.0.1:28604']
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

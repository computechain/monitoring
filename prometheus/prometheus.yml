global:
  scrape_interval: 15s # Scrape metrics every 15 seconds
  evaluation_interval: 15s # Evaluate rules every 15 seconds
  external_labels:
    monitor: 'computechain-monitor'

# Scrape configurations
scrape_configs:
  # ComputeChain Validator 1 (main)
  - job_name: 'computechain-validator-1'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          instance: 'validator-1'
          validator: 'validator_1'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # ComputeChain Validator 2 (DISABLED for single-validator monitoring)
